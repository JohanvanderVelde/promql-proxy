apiVersion: apps/v1
kind: Deployment
metadata:
  name: promql-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promql-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: promql-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promql-proxy
    spec:
      serviceAccountName: promql-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: upstream-tls
          secret:
            secretName: ca-certificates
      containers:
        - name: promql-proxy
          image: localhost/promql-proxy:latest
          imagePullPolicy: Never
          env:
            - name: UPSTREAM
              valueFrom:
                secretKeyRef:
                  name: promql-proxy-upstream-auth
                  key: upstream
            - name: UPSTREAM_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: promql-proxy-upstream-auth
                  key: upstream-basic-auth-username
            - name: UPSTREAM_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: promql-proxy-upstream-auth
                  key: upstream-basic-auth-password
          args:
            - --upstream=$(UPSTREAM)
            - --listen-address=:8080
            - --metrics-address=:9090
            - --header-name=X-Forwarded-User
            - --groups-header=X-Forwarded-Groups
            - --cache-ttl=60s
            - --rbac-resource=pods
            - --rbac-api-group=metrics.k8s.io
            - --rbac-verb=get
            - --upstream-basic-auth-username=$(UPSTREAM_BASIC_AUTH_USERNAME)
            - --upstream-basic-auth-password=$(UPSTREAM_BASIC_AUTH_PASSWORD)
            - --upstream-tls-ca-file=/etc/promql-proxy/tls/ca.crt
          volumeMounts:
            - name: upstream-tls
              mountPath: /etc/promql-proxy/tls
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

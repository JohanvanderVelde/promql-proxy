apiVersion: apps/v1
kind: Deployment
metadata:
  name: promql-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promql-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: promql-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promql-proxy
    spec:
      serviceAccountName: promql-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: upstream-auth
          secret:
            secretName: promql-proxy-upstream-auth
      containers:
        - name: promql-proxy
          image: localhost/promql-proxy:latest
          imagePullPolicy: Never
          args:
            - --upstream=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            - --listen-address=:8080
            - --metrics-address=:9090
            - --header-name=X-Forwarded-User
            - --groups-header=X-Forwarded-Groups
            - --cache-ttl=60s
            - --rbac-resource=pods
            - --rbac-api-group=metrics.k8s.io
            - --rbac-verb=get
            - --upstream-basic-auth-username=promql-proxy
            - --upstream-basic-auth-password-file=/etc/promql-proxy/auth/password
          volumeMounts:
            - name: upstream-auth
              mountPath: /etc/promql-proxy/auth
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
